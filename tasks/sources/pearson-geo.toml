# Outline of a high-school geometry textbook that "Geometry 2" reads for topics to connect
# to geometric algebra. Format and rules: the external-source-outlines.md reference doc of
# github.com/billsix/runClaudeInContainer. Coverage is NOT recorded here: run
# /source-coverage pearson-geo (it reads the `covers:` tags in book/ and notebooks/).
#
# Where each field came from (2026-11-27):
# - chapter and lesson TITLES: the table of contents as the maintainer typed it from his
#   own copy, in his lower case, with five spellings corrected by the agent. Lessons marked
#   "not in the maintainer's table of contents" came from a public curriculum map instead.
# - NUMBERS and PAGES: a school's public curriculum map for this series (see
#   tasks/reference/high-school-geometry-objects.md), not the book. A number is given only
#   where that map gives one. A page is where the lesson's EXERCISES begin, so the lesson
#   itself starts a few pages earlier. None is verified: page_verified is false throughout.
# - topic names and summaries: the project's own words.
#
# The book is all rights reserved. Add titles, numbers, pages and own-words summaries only;
# never its definitions, exercises, examples or figures.

