[project]
name = "gacalc"
version = "0.1.0"
authors = [{name="William Emerison Six", email="billsix@gmail.com"}]
description = "Geometric Algebra"
readme = "README.md"
# PEP 639 SPDX expression; LGPL-2.1-only matches modelviewprojection's
# pgzero_gl shim, whose Vector2 work-alike subclasses gacalc.g2.Vector2.
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
# Floor is 3.13: the code uses typing.TypeIs (added in 3.13). The dev container runs 3.14.
requires-python = ">=3.13"

# Runtime dependencies -- only what the library needs to import and run.
dependencies = ["numpy", "sympy"]

# Optional feature groups -- install e.g. `pip install "gacalc[notebooks]"`.
# The dev container installs all of them (see Dockerfile); end users pick what
# they need.  Loose (unpinned) on purpose: a library shouldn't force exact
# versions on its consumers.
[project.optional-dependencies]
# matplotlib/LaTeX plotting helpers (gacalc.nbplotutils) + the percent-format demos
notebooks = ["matplotlib", "ipython", "matplotlib-inline", "pandas", "jupytext"]
# the interactive JupyterLab environment to run those notebooks
jupyter = ["jupyterlab", "jupyter", "jupyter-lsp", "jupyterlab-mathjax3"]
# tooling for building, linting, and publishing -- not needed at runtime
dev = ["build", "twine", "ruff"]

# numpy + sympy are *build* dependencies: the build_py hook in setup.py runs
# tools/gen_specialized.py when the generated modules are absent, and that
# generator imports gacalc.base/gn (which need numpy + sympy). They are
# unused when building from an sdist/wheel that already ships the generated code.
[build-system]
requires = ["setuptools", "wheel", "numpy", "sympy"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
# The intentionally-vendored Emacs tree under entrypoint/ (.emacs.d/elpa/) is
# third-party code we must never reformat. Excluded here so both `ruff check` and
# `ruff format` skip it, no matter how they're invoked (CLI, format.sh, editor).
# tasks/adhoc/ holds transient, task-scoped audit scripts (removed/promoted at
# archive), not maintained source -- not policed by the gate.
extend-exclude = ["entrypoint", "tasks/adhoc"]

[tool.ruff.lint]
select = [
       'F401', 'F811', 'E402', 'I001', 'TID252', "F841",
       "B006", "B007", "B008", "UP007",
       "UP035", "S311", "S602", "T201",
       "E", "F", "I", "N"
       ]
# N806 (non-lowercase variable in a function) is disabled project-wide: gacalc
# follows Hestenes' convention that a CAPITAL letter denotes a multivector (A, B,
# R, ...), so uppercase math locals are intentional here, not accidental
# constants.  Argument naming (N803) stays enforced -- parameters remain
# lowercase; this only frees local bindings inside a function body.
ignore = ["N806"]

[tool.ruff.lint.per-file-ignores]
# tools/gen_specialized.py is a code generator whose CUSTOM_METHOD_DOCS table and doc
# helpers are dominated by docstring-content string literals (specialized prose + doctests
# for the generated classes) that `ruff format` cannot reflow.  Enforcing E501 there would
# force awkward mid-prose splits in teaching text and is not meaningful for it -- the
# generator's actual code is still wrapped by `ruff format`, and the generated modules are
# gitignored (not line-length-gated).  See tasks/reference/generated-docstrings.md.
"tools/gen_specialized.py" = ["E501"]
# tools/render_epix_figures.py and tools/check_epix_keywords.py are command-line build
# steps whose progress/failure lines ARE their output (same class as a CLI gate).
"tools/render_epix_figures.py" = ["T201"]
"tools/check_epix_keywords.py" = ["T201"]
# book/docs/conf.py's only long line is inside the r\"\"\"...\"\"\" LaTeX preamble
# (the \directlua luaotfload-fallback line, 89 cols) -- un-reflowable LaTeX/lua
# string content, and an inline `# noqa` is impossible there (it would inject
# text into the preamble and break the lualatex build).  Same class as the
# gen_specialized.py exemption above: E501 is not meaningful for string-literal
# content ruff cannot wrap.  conf.py is Sphinx config (strings/paths/prose), so
# there is no reformattable code E501 would usefully guard here.
"book/docs/conf.py" = ["E501"]

[tool.ty.environment]
# tools/ (the code generator + its astbuild DSL) is a real source directory but
# not a package on the default path. Declare it so `ty check tests` resolves the
# `import astbuild` / `import gen_specialized` in tests/test_generator.py (which
# add tools/ to sys.path at runtime). This is module-resolution config, not a
# diagnostic override -- every rule still checks every file.
extra-paths = ["tools"]
