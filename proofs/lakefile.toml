name = "GacalcProofs"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GacalcProofs"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false # off: these are standalone self-check proofs, not a Mathlib PR (the header/style linters just add noise)
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "GacalcProofs"
