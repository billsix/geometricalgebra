# The generated g2.py / g3.py are derived from the Gn reference (provably
# correct) and rendered from an AST, which cannot carry inline `# ty: ignore`
# comments.  ty's numbers.Real arithmetic on the rotor-sandwich closed form
# yields false `unsupported-operator` positives, and the generated `sandwich`'s
# typing.Self return (the generator's convention for every method) trips
# `invalid-method-override` against the ABC.  Disable ONLY those two rules for
# ONLY these generated files; every other rule, and every other file, stays
# strict.  (g1.py has no rotor, hence no sandwich, so it is not listed.)
[[overrides]]
include = ["src/gacalc/g2.py", "src/gacalc/g3.py"]

[overrides.rules]
unsupported-operator = "ignore"
invalid-method-override = "ignore"
