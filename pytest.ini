[pytest]
pythonpath = src
# Limit collection to the library + test suite so --doctest-modules never walks the
# vendored Emacs tree under entrypoint/ or the notebooks/.
testpaths = src tests
# Run the docstring examples (e.g. transforms.py) as tests so they can't silently rot.
# nbplotutils imports a matplotlib GUI backend that fails headless and has no doctests.
addopts = --doctest-modules --ignore=src/geometricalgebra/nbplotutils.py
