[pytest]
pythonpath = src
# Limit collection to the library + test suite + the generator so --doctest-modules
# never walks the vendored Emacs tree under entrypoint/ or the notebooks/.  ``tools``
# is included so the generator's own docstring examples (tools/gen_specialized.py)
# run as tests like the rest; this requires the generated g*.py to exist (bench.py
# imports them at module top), which every collection flow already regenerates first.
testpaths = src tests tools
# Run the docstring examples (e.g. transforms.py) as tests so they can't silently rot.
addopts = --doctest-modules
